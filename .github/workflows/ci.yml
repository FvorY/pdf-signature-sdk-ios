name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint lint --strict

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Unit tests (Swift Package)
        run: scripts/test.sh
      - name: Example app UI tests
        run: scripts/test.sh example

  podspec:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: pod lib lint
        run: pod lib lint --platforms=ios
