included:
  - Sources
  - Tests
  - Example/PdfSignatureExample

excluded:
  - .build
  - Example/PdfSignatureExample.xcodeproj

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - closure_spacing
  - sorted_imports

line_length:
  warning: 140
  error: 200

identifier_name:
  # Short names that match the web SDK API (`ui`) or geometry (`dx`, `w`, `sx`, `pw`)
  excluded: [id, x, y, ok, ui, dx, dy, w, h, i, sx, sy, pw, ph, mx, my, mw, mh, dw, dh]

type_body_length:
  warning: 400
